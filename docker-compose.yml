services:
  # ── FastAPI Application ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bytemind-automation-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://bytemind:${POSTGRES_PASSWORD}@postgres:5432/bytemind_content
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./content:/app/content
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - bytemind-net

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bytemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bytemind_content
      POSTGRES_USER: bytemind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytemind -d bytemind_content"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bytemind-net

  # ── Redis (rate limiting + scheduler state) ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bytemind-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bytemind-net

volumes:
  postgres_data:
  redis_data:

networks:
  bytemind-net:
    driver: bridge
