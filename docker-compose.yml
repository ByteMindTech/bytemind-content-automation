services:
  # ── Caddy reverse proxy (auto-TLS) ────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: bytemind-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - bytemind-net

  # ── FastAPI Application ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bytemind-automation-api
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://bytemind:${POSTGRES_PASSWORD}@postgres:5432/bytemind_content
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./content:/app/content
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - bytemind-net

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bytemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bytemind_content
      POSTGRES_USER: bytemind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c max_connections=50
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.3"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytemind -d bytemind_content"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bytemind-net

  # ── Redis (rate limiting + scheduler state) ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bytemind-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 64mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.1"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bytemind-net

  # ── PostgreSQL daily backup ───────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: bytemind-backup
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: /bin/sh
    command: >
      -c "pg_dump -h postgres -U bytemind -d bytemind_content -Fc
      -f /backups/bytemind_$$(date +%Y%m%d_%H%M%S).dump
      && find /backups -name '*.dump' -mtime +7 -delete"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bytemind-net
    profiles:
      - backup

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  bytemind-net:
    driver: bridge
