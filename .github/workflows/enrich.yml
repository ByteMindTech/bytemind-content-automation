name: Trigger Content Enrichment

on:
  repository_dispatch:
    types: [new_blog_article]
  workflow_dispatch:
    inputs:
      article_path:
        description: Relative path to the .md file in ByteMindTech repo
        required: true

jobs:
  enrich:
    name: Ingest + AI Enrich
    runs-on: ubuntu-latest

    steps:
      - name: Call /generate API
        run: |
          ARTICLE_PATH="${{ github.event.client_payload.article_path || github.event.inputs.article_path }}"
          ARTICLE_CONTENT=$(cat "$ARTICLE_PATH" 2>/dev/null || echo "")

          if [ -z "$ARTICLE_CONTENT" ]; then
            echo "No article content provided — skipping."
            exit 0
          fi

          curl -X POST "${{ secrets.AUTOMATION_API_URL }}/generate" \
            -H "Authorization: Bearer ${{ secrets.AUTOMATION_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"source_content\": $(echo \"$ARTICLE_CONTENT\" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))'),
              \"source_path\": \"$ARTICLE_PATH\"
            }" \
            --fail-with-body \
            --silent | python3 -m json.tool
