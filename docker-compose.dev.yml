services:
  app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dev
    container_name: bytemind-automation-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://bytemind:devpassword@postgres:5432/bytemind_content
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app           # full source mount for hot reload
      - ./content:/app/content
    networks:
      - bytemind-dev-net

  postgres:
    image: postgres:16-alpine
    container_name: bytemind-postgres-dev
    environment:
      POSTGRES_DB: bytemind_content
      POSTGRES_USER: bytemind
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytemind -d bytemind_content"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bytemind-dev-net

  redis:
    image: redis:7-alpine
    container_name: bytemind-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bytemind-dev-net

networks:
  bytemind-dev-net:
    driver: bridge
